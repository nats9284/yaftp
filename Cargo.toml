[package]
name = "yaftp"
version = "0.1.2"
authors = ["b23r0 <b23r0@foxmail.com>"]
edition = "2021"
description = "Yet another File Transfer Protocol support with resume broken transfer & reverse mode & largefile implementation by Rust."
repository = "https://github.com/b23r0/yaftp"
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
simple_logger = "5.2.0"
log = "0.4.34"
futures = "0.3.34"
async-std = {version = "1" , features = ["attributes"]}
console = "0.16.6"
tabled = "0.22.0"
chrono = "0.4.45"
path-absolutize = "4.0.1"
md-5 = "0.11.0"
indicatif = "0.18.6"

